# The orchestrator's own pin (GEN-R-7: pins live here and nowhere else).
# mise enforces this at run time; ./setup reads the same line with sed to
# decide which release to install, because it runs before mise exists and so
# cannot ask mise to parse this file.
min_version = "2026.8.6"

[settings]
experimental = true

[settings.task]
source_freshness_hash_contents = true

[env]
# --- pins: the single location (GEN-R-7) ---
NVIM_VERSION       = "v0.11.6"
OHMYZSH_REF        = "b54a71977574cfcf659cc2f15a5e6422f17a8da7"
AUTOSUGGEST_REF    = "c3d4e576c9c86eac62884bd47c01f6faed043fc5"
CMLIB_REF          = "3bd355abf81081dd90ff49728f7629ea340357ec"
CMLIB_CMCONF_REF   = "v1.2.1"
CMLIB_CMDEF_REF    = "v1.0.3"
CMLIB_CMUTIL_REF   = "66ea4a90adfe67567006e09b26122f370eeb2066"
CMLIB_STORAGE_REF  = "f4080a0e6e8a47831f04bbd371871fecaf5d9560"

# cmakelib's own outputs (CMLIB-R-2), declared here rather than emitted from
# the shell template. This is what removes the hidden coupling flagged by
# GEN-R-9, ZSH-R-9 and CMLIB-R-3.
CMLIB_DIR                       = "{{config_root}}/_vendor/cmakelib"
CMLIB_COMPONENT_LOCAL_BASE_PATH = "{{config_root}}/_vendor/"

# The seventeen desktop applications (APPS-R-11: they live here and nowhere
# else, so GEN-R-7 still holds now that they are no longer in
# [bootstrap.packages]). Read by [tasks.apps] and by [tasks.preview].
FLATPAK_APPS = """
org.kicad.KiCad org.freecad.FreeCAD net.ankiweb.Anki md.obsidian.Obsidian
com.prusa3d.PrusaSlicer com.jgraph.drawio.desktop com.usebottles.bottles
org.texstudio.TeXstudio org.onlyoffice.desktopeditors org.openstreetmap.josm
com.axosoft.GitKraken org.kde.krita com.github.tchx84.Flatseal
org.gnome.Extensions com.mattjakeman.ExtensionManager cc.arduino.IDE2
org.kde.tellico
"""

[tools]
cmake = "3.30.1"
go    = "1.23.3"

# [system.packages] does not exist in this mise version (GEN-A-8); the
# installed release (2026.8.6) shipped the same subsystem under
# [bootstrap.packages] instead. Verified empirically: `mise system --help`
# fails (no such subcommand), `mise bootstrap packages --help` succeeds.
[bootstrap.user]
login_shell = "/usr/bin/zsh"

[bootstrap.packages]
"dnf:zsh"                 = "latest"
"dnf:direnv"              = "latest"
"dnf:fzf"                 = "latest"
"dnf:the_silver_searcher" = "latest"
"dnf:kitty"               = "latest"
"dnf:python3-neovim"      = "latest"
# Neovim build prerequisites, verbatim from upstream (GEN-A-10)
"dnf:ninja-build"         = "latest"
"dnf:gcc"                 = "latest"
"dnf:make"                = "latest"
"dnf:gettext"             = "latest"
"dnf:curl"                = "latest"
"dnf:glibc-gconv-extra"   = "latest"
"dnf:git"                 = "latest"
"dnf:flatpak"             = "latest"

# --manager dnf is not required for correctness now that this table holds
# only dnf: entries (the flatpak: entries moved to FLATPAK_APPS and
# [tasks.apps]). It stays because it states the scope at the call site.
[tasks.packages]
run = "mise bootstrap packages apply --yes --manager dnf"

# chsh authenticates the target user via PAM, which blocks on a password
# prompt for a non-root caller; running it via sudo skips that prompt. sudo's
# secure_path drops $APP_DIR/bin, so PATH must be forwarded explicitly.
# This is the only literal sudo in this file (GEN-R-19); mise elevates on its
# own for the dnf apply above.
# depends = ["packages"]: mise runs independent dependencies of [tasks.system]
# in parallel, and chsh here targets /usr/bin/zsh, which only exists once the
# dnf apply in packages has installed it. Without this, the two tasks race.
[tasks.login-shell]
depends = ["packages"]
run = 'sudo env "PATH=$PATH" mise bootstrap user apply --yes'

# The privileged phase. Everything reachable from here may elevate; nothing
# outside it may (GEN-R-19).
[tasks.system]
depends = ["packages", "login-shell"]

# mise does not create flatpak remotes (APPS-A-5), so this is an explicit
# preceding step (APPS-R-7). Adding the remote manually, rather than via
# Fedora's flatpak-remote package, is what removes Fedora's default filter
# (APPS-A-7). --if-not-exists makes it idempotent (APPS-R-8), and --user is
# what removes the elevation: a system remote is not visible to a --user
# install, so the remote and the installs must share a scope.
[tasks.flathub]
depends = ["preflight"]
run = """
flatpak remote-add --user --if-not-exists flathub \
  https://dl.flathub.org/repo/flathub.flatpakrepo
"""

# --or-update is load-bearing: a plain install on an application that is
# already present warns and exits non-zero, which would fail the second-run
# requirement (GEN-R-4). --or-update makes that case a silent no-op update.
# flatpak's own progress output is the one place this repository emits status;
# suppressing it during a multi-gigabyte download would be worse than the noise.
[tasks.apps]
depends = ["flathub"]
run = """
set -euo pipefail
for app in $FLATPAK_APPS; do
    flatpak install --user --noninteractive --or-update flathub "$app"
done
"""

# The unprivileged phase's system prerequisites. Blocking here rather than
# letting the Neovim build fail on a missing compiler is the same
# refuse-and-name-the-path answer the fetch, render and link guards give: the
# message is the only thing that tells the user the privileged phase was never
# run. Silent on success.
#
# The list gates what the tasks execute and nothing else. git and curl are used
# by setup, fetch and the Neovim download; gcc, make, ninja and msgfmt by the
# Neovim build; flatpak by flathub and apps. glibc-gconv-extra ships no binary
# and cannot be command-checked, so it stays asserted by rpm -q in the
# privileged phase's checks and otherwise surfaces during the build.
# mise templates run scripts with Tera before handing them to the shell, so
# the usual ${#missing[@]} length check is unusable here: the literal `{#`
# reads as an unclosed Tera comment opener and fails task validation before
# bash ever sees the script. An emptiness test on ${missing[*]-} sidesteps it.
[tasks.preflight]
run = """
set -euo pipefail
missing=()
for c in git curl gcc make ninja msgfmt flatpak; do
    command -v "$c" >/dev/null 2>&1 || missing+=("$c")
done
if [[ -n "${missing[*]-}" ]]; then
    echo "preflight: missing required commands: ${missing[*]}" >&2
    echo "preflight: these come from the privileged half" >&2
    echo "preflight: run './setup system' first, or install them yourself" >&2
    exit 1
fi
"""

# Decorative by mise's design, kept deliberately: mise installs everything in
# [tools] before it runs any task at all, so `mise install` here has nothing
# left to do and depends = ["preflight"] gates nothing - `./setup fetch` on a
# fresh box downloads both SDKs on the way to fetching. Removing the task would
# leave no way to ask for the SDK step alone, which is what [tasks.all] and the
# harness (`test/run.sh tools tools unprivileged`) name, so it stays as that
# entry point.
[tasks.tools]
depends = ["preflight"]
run = "mise install"

[tasks.fetch]
run = """
set -euo pipefail
umask g-w,o-w   # ohmyzsh requires this or compinit fails (ZSH-A-2)
mkdir -p _vendor zsh/custom/plugins

# R25: never destroy a directory this task did not create. A registered
# submodule gitlink, or any uncommitted local changes, stop the task with a
# non-zero exit and a message naming the path instead of touching it.
refuse_if_submodule() {
    local dir="$1"
    if git ls-files -s -- "$dir" 2>/dev/null | grep -q '^160000'; then
        echo "fetch: refusing to touch $dir: registered as a git submodule" >&2
        exit 1
    fi
}
# R25 again, for the case the submodule and dirty guards both miss: a plain
# directory that has content but no .git was not left behind by this task (a
# clone always leaves a .git behind), so it is somebody's own data rather than
# a stale checkout to be replaced. Same for a file or symlink in the way.
refuse_if_unregistered_content() {
    local dir="$1"
    if [[ -d $dir ]]; then
        if [[ -n $(ls -A "$dir" 2>/dev/null) ]]; then
            echo "fetch: refusing to replace $dir: not a git work tree and not empty" >&2
            exit 1
        fi
        return
    fi
    echo "fetch: refusing to replace $dir: exists and is not a directory" >&2
    exit 1
}
refuse_if_dirty() {
    local dir="$1"
    # -e "$dir/.git", not `git -C "$dir" rev-parse --is-inside-work-tree`:
    # the latter walks up to the enclosing repo's .git for any plain
    # subdirectory that lacks its own, silently pointing every subsequent
    # git command at the wrong (outer) repository instead of failing.
    if [[ -e $dir/.git ]] && [[ -n $(git -C "$dir" status --porcelain 2>/dev/null) ]]; then
        echo "fetch: refusing to touch $dir: uncommitted changes present" >&2
        exit 1
    fi
}

# Re-fetches only when the work tree isn't already at the pinned ref. The
# ref is resolved locally first (works for SHA pins and tag pins alike) so
# an up-to-date clone touches the network for nothing (idempotence). A path
# that already has its own .git (a plain clone, or a submodule gitlink such
# as the pre-existing zsh-autosuggestions checkout, R9) is reused in place
# and never deleted, even when its ref does not yet match.
fetch_pinned() {
    local dir="$1" url="$2" ref="$3"
    if [[ ! -e $dir/.git ]]; then
        if [[ -e $dir || -L $dir ]]; then
            refuse_if_submodule "$dir"
            refuse_if_unregistered_content "$dir"
        fi
        rm -rf "$dir"
        git clone --quiet "$url" "$dir"
    fi
    local target
    target=$(git -C "$dir" rev-parse --verify --quiet "${ref}^{commit}" 2>/dev/null || true)
    if [[ -z $target || $target != $(git -C "$dir" rev-parse HEAD) ]]; then
        refuse_if_dirty "$dir"
        git -C "$dir" fetch --quiet --tags origin
        git -C "$dir" checkout --quiet --force "$ref"
    fi
}

fetch_pinned _vendor/ohmyzsh https://github.com/ohmyzsh/ohmyzsh.git "$OHMYZSH_REF"
# Oh My Zsh resolves custom plugins only under $ZSH_CUSTOM/plugins/, so this
# clones to its real load path rather than _vendor/ plus a symlink (R9).
fetch_pinned zsh/custom/plugins/zsh-autosuggestions https://github.com/zsh-users/zsh-autosuggestions.git "$AUTOSUGGEST_REF"
fetch_pinned _vendor/cmakelib https://github.com/cmakelib/cmakelib.git "$CMLIB_REF"
fetch_pinned _vendor/cmakelib-component-cmconf  https://github.com/cmakelib/cmakelib-component-cmconf.git  "$CMLIB_CMCONF_REF"
fetch_pinned _vendor/cmakelib-component-cmdef   https://github.com/cmakelib/cmakelib-component-cmdef.git   "$CMLIB_CMDEF_REF"
fetch_pinned _vendor/cmakelib-component-cmutil  https://github.com/cmakelib/cmakelib-component-cmutil.git  "$CMLIB_CMUTIL_REF"
fetch_pinned _vendor/cmakelib-component-storage https://github.com/cmakelib/cmakelib-component-storage.git "$CMLIB_STORAGE_REF"
"""

# A task gated by its own sources/outputs cannot be the one writing its
# source: the write only happens once mise has already decided to run the
# task, so the file mise compares against never reflects a version bump
# ahead of that decision (R27). This ungated task always runs first and
# rewrites the stamp from the current env; source_freshness_hash_contents
# (see [settings.task] above) means an unchanged NVIM_VERSION/APP_DIR
# reproduces byte-identical content, so [tasks.nvim]'s freshness gate below
# still sees "unchanged" and skips - only an actual pin or prefix change
# changes the hash and forces a rebuild.
[tasks.nvim-stamp]
run = """
mkdir -p .build
printf '%s\n%s\n' "$NVIM_VERSION" "$APP_DIR" > .build/nvim.version
"""

# Freshness keys on the version stamp above, not the source tree (mise has
# open upstream bugs where sources/outputs freshness misfires with multiple
# outputs or deleted sources) - exactly one source, one output. Invalidation
# on a prefix change also has a second, independent cause: outputs is
# templated with {{env.APP_DIR}}, so a new prefix names a path that does not
# exist yet, which mise treats as not-fresh regardless of the stamp.
[tasks.nvim]
depends = ["tools", "preflight", "nvim-stamp"]
sources = [".build/nvim.version"]
outputs = ["{{env.APP_DIR}}/bin/nvim"]
run = """
set -euo pipefail
src=".build/neovim-${NVIM_VERSION}"
if [[ ! -d $src ]]; then
    curl -fsSL "https://github.com/neovim/neovim/archive/refs/tags/${NVIM_VERSION}.tar.gz" \
      | tar -xz -C .build
    mv ".build/neovim-${NVIM_VERSION#v}" "$src"
fi
cd "$src"
# CMAKE_PRG, not CMAKE_PROGRAM: Neovim's Makefile only recognises CMAKE_PRG
# (defaults to a bare `cmake` on PATH otherwise, silently bypassing the
# pinned cmake installed under $APP_DIR by the tools task). mise puts the
# [tools]-declared cmake on PATH for task execution, so command -v resolves
# to the pinned mise-managed cmake rather than any system copy.
make CMAKE_BUILD_TYPE=RelWithDebInfo \
     CMAKE_INSTALL_PREFIX="$APP_DIR" \
     CMAKE_PRG="$(command -v cmake)"
make CMAKE_INSTALL_PREFIX="$APP_DIR" install
"""

# No sources/outputs (R12): mise has open upstream bugs where freshness
# misfires with multiple outputs, and the body is two renders - always running
# it is idempotent by construction and, unlike a freshness gate, also
# overwrites output left behind by the retired shell scripts.
#
# R25 has its most consequential case here. zsh/zshrc and vim/init.vim are
# gitignored, so anything the user added to them by hand exists in no template
# and no commit, and `git status` cannot warn about it either. The old
# unconditional `cp` destroyed it on the first run. Now the rendered bytes are
# produced first and compared: an output that already matches is left strictly
# alone (no rewrite, no message, clean second run), and an output that differs
# stops the task by name.
#
# Refusing rather than copying the file aside is the same answer the fetch and
# link guards give, and R25 is a rule about not deciding on the user's behalf:
# a refusal is a decision the user has to make once, whereas a `.pre-mise`
# neighbour is a second copy nobody reads, needs its own rule for what happens
# when it already exists, and leaves the user's real content out of the file
# that is actually loaded anyway. The message is required for correctness, not
# decoration - the path it names is the only pointer to content that exists
# nowhere else.
[tasks.render]
depends = ["fetch"]
run = """
set -euo pipefail
root="$(git rev-parse --show-toplevel)"

trap 'rm -f zsh/zshrc.mise-new vim/init.vim.mise-new' EXIT

render() {
    local template="$1" out="$2" new="$2.mise-new"
    sed -e "s|___OHMYZSH_PROJECT_DIR___|${root}/_vendor|g" \
        -e "s|___ZSH_CUSTOM_DIR___|${root}/zsh/custom|g" \
        -e "s|___VIM_BASE_DIR___|${root}/vim|g" \
        "$template" > "$new"
    # sha256sum, not cmp: cmp ships in diffutils, which a minimal Fedora
    # install does not have, and a comparison that errors out would refuse
    # every run - including the identical-content one that has to stay a
    # no-op. sha256sum is coreutils, so it is always there.
    if [[ -e $out ]] && [[ "$(sha256sum < "$new")" == "$(sha256sum < "$out")" ]]; then
        rm -f "$new"
        return
    fi
    if [[ -e $out || -L $out ]]; then
        rm -f "$new"
        echo "render: refusing to overwrite $out: its content differs from $template rendered" >&2
        echo "render: $out is gitignored, so those edits exist nowhere else; move them into $template" >&2
        echo "render: (or move the file aside), then re-run" >&2
        exit 1
    fi
    mv "$new" "$out"
}

render zsh/template/zshrc_template    zsh/zshrc
render vim/template/init_template.vim vim/init.vim
"""

# R25 applies here too: a target that already exists and is not a symlink
# resolving inside this repo is left untouched and the task fails loudly,
# naming the path (the message is required for correctness, not decorative
# output). An existing correct symlink is replaced silently, so re-running
# stays a clean no-op - this is what KITTY-A-1 was missing: the old script
# linked without replacing and never created the parent directory, so it
# failed on every second run and on a fresh machine.
[tasks.link]
depends = ["render"]
run = """
set -euo pipefail
root="$(git rev-parse --show-toplevel)"

link() {
    local src="$1" dst="$2"
    mkdir -p "$(dirname "$dst")"
    if [[ -e $dst || -L $dst ]]; then
        if [[ -L $dst ]] && [[ "$(readlink -f "$dst")" == "$root"/* ]]; then
            ln -sfn "$src" "$dst"
            return
        fi
        echo "link: refusing to replace $dst: not a symlink into this repository" >&2
        exit 1
    fi
    ln -sfn "$src" "$dst"
}

link "${root}/zsh/zshrc"        "$HOME/.zshrc"
link "${root}/vim/init.vim"     "$HOME/.config/nvim/init.vim"
link "${root}/kitty/kitty.conf" "$HOME/.config/kitty/kitty.conf"
"""

[tasks.all]
depends = ["preflight", "apps", "tools", "fetch", "nvim", "render", "link"]
run = "echo setup complete"

# GEN-R-10 requires a mode that reports what would change without changing it.
# Split along the same seam as the phases: this one must stay runnable where
# sudo does not exist, which is where checks-bootstrap.sh now exercises it.
# The application half is hand-rolled because driving flatpak directly costs
# the --dry-run the declarative table would have provided; it reads the same
# FLATPAK_APPS list the install step reads.
[tasks.preview]
run = """
set -euo pipefail
mise run --dry-run all
installed=$(flatpak list --user --columns=application 2>/dev/null || true)
for app in $FLATPAK_APPS; do
    grep -Fqx "$app" <<<"$installed" || echo "would install: $app"
done
"""

[tasks.preview-system]
run = """
mise run --dry-run system
mise bootstrap packages apply --dry-run --manager dnf
"""
